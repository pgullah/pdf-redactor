# Run with: --config examples/masking.yaml
# Mask appearance is separate from the rules that identify sensitive fields.
masking:
  default:
    mode: black
  fields:
    ni_number:
      mode: text
      text: XXXXX
      background: '#FFFFFF'
      foreground: '#000000'
    tax_code:
      mode: text
      text: XXXXX
      background: '#FFFFFF'
      foreground: '#000000'
    postal_address:
      mode: text
      text: XXXXX
    tax_reference:
      mode: text
      text: XXXXX
    tax_residence:
      mode: text
      text: XXXXX
    email_address:
      mode: text
      text: '[EMAIL REMOVED]'
    account_number:
      mode: black
    # Qualify a field when multiple detectors use the same name:
    # general.phone_number:
    #   mode: fill
    #   background: '#DDDDDD'
  regions:
    # Mask company name in the header of the payslip:
    - page: 0
      x: 0.70
      y: 0.02
      w: 0.28
      h: 0.05
    # Mask name & company name
    - page: 0
      x: 0.03
      y: 0.12
      w: 0.94
      h: 0.02


general:
  fields:
    ni_number:
      labels: [National Insurance Number, NI Number, NI Letter, National Insurance No, NI Letter & No]
      max_lines: 1
    tax_code:
      labels: [Tax Code, Tax Code Reference]
      max_lines: 1
    postal_address:
      labels: [Address, Postal Address, Mailing Address]
      max_lines: 5
    account_number:
      labels: [Account Number, Account No]
      max_lines: 1
    tax_reference:
      labels: [Tax Reference, Tax Reference Number]
      max_lines: 1
    tax_residence:
      labels: [Tax Residence, Tax Residence Country, Tax District]
      max_lines: 1
  stop_labels: [Date, Email, Phone, Total, Notes, Signature]
  patterns:
    email_address:
      regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
